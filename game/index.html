<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VAULT BREAK: The Midnight Job</title>
  <style>
    body {
      margin: 0;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      width: min(100vw, 177.78vh);
      height: min(56.25vw, 100vh);
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
      background-color: #1a1d24;
      cursor: crosshair;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="sr-only">VAULT BREAK: The Midnight Job — Top-down 2D canvas heist game.</div>
  <canvas id="game"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
